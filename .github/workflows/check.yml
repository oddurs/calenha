name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: the language obeys its own rules
        run: uv run calenha check
      - name: tests
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci
      - name: export the language
        working-directory: web
        run: npm run data
      - name: lint, type-check, test
        working-directory: web
        run: |
          npm run lint
          npm run check
          npm test
      - name: build every page
        working-directory: web
        run: npm run build
