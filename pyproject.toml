[project]
name = "calenha"
version = "0.1.0"
description = "Calenha — the calm speech. A constructed language, kept as data and compiled by a small toolkit."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Oddur Sigurdsson" }]
dependencies = []

[project.scripts]
calenha = "calenha.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calenha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # the language is full of ë, ã and ·

[tool.ruff.lint.per-file-ignores]
# html templates read better unwrapped
"src/calenha/site/*.py" = ["E501"]
"tests/test_site.py" = ["E501"]
