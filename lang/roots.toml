# roots — the seeds words grow from.
#
# A root is bare: no ending, never spoken alone. Words are built by adding affixes
# (affixes.toml) or by joining roots together. Every root should have children in
# the lexicon; `calenha check` warns about roots no word grows from.
#
#   root     the bare form
#   meaning  short, lowercase
#   kin      where the sound was found (optional) — inspiration, not etymology

# -- light & sky ---------------------------------------------------------------

[[root]]
root = "sol"
meaning = "sun, the light of day"
kin = "portuguese sol"

