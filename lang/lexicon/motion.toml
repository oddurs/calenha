# verbs — every one ends in -u, and every one is an invitation.
# there is no way to command in Calenha. velu is "come wander", never "go".

[[word]]
word = "velu"
gloss = "to wander"
pos = "verb"
from = ["vel", "-u"]

[[word]]
word = "velunda"
gloss = "a wandering"
pos = "noun"
from = ["vel", "-unda"]
sense = "a going-about with nowhere to be; the coast road taken slowly"

[[word]]
word = "venu"
gloss = "to come, to arrive"
pos = "verb"
from = ["ven", "-u"]

