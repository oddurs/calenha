# the sea, and all water that moves.
# the Calenhi read their land from the sea inward, so the dictionary starts here.

[[word]]
word = "mar"
gloss = "sea"
pos = "noun"
from = ["mar"]
sense = "the first thing; written Mar when it is spoken of as an elder"

